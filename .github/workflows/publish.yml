name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # required for npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - name: Verify release tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_NAME="${{ github.event.release.tag_name }}"
          if [ "$PKG_VERSION" != "$TAG_NAME" ]; then
            echo "Release tag $TAG_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - name: Verify .claude-plugin/plugin.json version matches too
        run: |
          PLUGIN_VERSION="v$(node -p "require('./.claude-plugin/plugin.json').version")"
          TAG_NAME="${{ github.event.release.tag_name }}"
          if [ "$PLUGIN_VERSION" != "$TAG_NAME" ]; then
            echo ".claude-plugin/plugin.json version $PLUGIN_VERSION does not match tag $TAG_NAME"
            exit 1
          fi
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@latest
      - run: npm publish --access public --provenance
